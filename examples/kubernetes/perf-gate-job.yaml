# Post-deploy latency check for a vLLM service running in the same cluster.
#
# With Argo CD, the PostSync hook runs this Job after every sync; if an SLO is breached the
# container exits 1, the Job fails, and the sync is marked failed. Without Argo CD, delete the
# annotations and apply it from your pipeline after the rollout:
#   kubectl apply -f perf-gate-job.yaml && kubectl wait --for=condition=complete job/llm-perf-gate --timeout=15m
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-perf-gate
  namespace: inference
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm-loadgate
          image: ghcr.io/nikhilsunku/llm-loadgate:0.1.0
          args:
            - "run"
            - "--base-url=http://vllm.inference.svc.cluster.local:8000/v1"
            - "--rate=4"
            - "--num-requests=300"
            - "--warmup=20"
            - "--synthetic-input-tokens=512"
            - "--max-tokens=256"
            - '--extra-body={"ignore_eos": true}'
            - "--slo=ttft_p95<800ms"
            - "--slo=tpot_p95<60ms"
            - "--slo=error_rate<1%"
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: token
                  optional: true
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
